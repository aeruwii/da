/* === ASTER v4.1 Creative & Experimental Redesign === */
body.creativeLab{
  --navy:#16131f;
  --navy2:#241d32;
  --bg:#f1e9dc;
  --paper:#fbf6ee;
  --text:#17141c;
  --muted:#74685f;
  --border:#221e1a;
  --teal:#136d68;
  --teal2:#dcefeb;
  --blue:#4b5ff2;
  --amber:#d26f43;
  --red:#b34b45;
  --radius:20px;
  --shadow:8px 8px 0 #d8cfc2;
  background:
    radial-gradient(circle at 12% 10%, rgba(75,95,242,.10), transparent 26%),
    radial-gradient(circle at 90% 14%, rgba(210,111,67,.12), transparent 18%),
    radial-gradient(circle at 74% 82%, rgba(19,109,104,.10), transparent 16%),
    linear-gradient(180deg,#f7f0e6 0%,#f0e7da 52%,#f5efe7 100%);
  color:var(--text);
}
body.creativeLab::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(0,0,0,.018), rgba(0,0,0,.018)),
    repeating-linear-gradient(0deg, transparent 0 33px, rgba(34,30,26,.035) 33px 34px),
    repeating-linear-gradient(90deg, transparent 0 33px, rgba(34,30,26,.025) 33px 34px);
  opacity:.65;
}
body.creativeLab .layout, body.creativeLab .main, body.creativeLab .content, body.creativeLab .topbar,
body.creativeLab .sidebar, body.creativeLab .card, body.creativeLab .miniNav{position:relative; z-index:1;}
body.creativeLab .sidebar{
  background:
    radial-gradient(circle at top left, rgba(255,255,255,.07), transparent 28%),
    linear-gradient(180deg, #171320 0%, #1d1628 45%, #16131f 100%);
  border-right:2px solid #2d2538;
  box-shadow:18px 0 0 rgba(34,30,26,.06);
  padding:28px 18px 24px;
}
body.creativeLab .brand{padding:0 8px 6px;align-items:flex-start}
body.creativeLab .brandMark{
  width:42px;height:42px;border-radius:50%;
  border:2px solid #c7b8ac;color:#fbf6ee;background:#de7a52;
  box-shadow:4px 4px 0 rgba(0,0,0,.18);font-size:20px;
}
body.creativeLab .brandMain,
body.creativeLab .topbar h1,
body.creativeLab .sectionIntro h2,
body.creativeLab .eqHero h2,
body.creativeLab .callout h3,
body.creativeLab .finSpotlight h3,
body.creativeLab .card h3,
body.creativeLab h2{
  font-family: Georgia, 'Times New Roman', serif;
  letter-spacing:-.02em;
}
body.creativeLab .brandMain{
  font-size:29px;
  letter-spacing:.06em;
  text-transform:uppercase;
  line-height:.95;
}
body.creativeLab .brandSub,
body.creativeLab .sideLabel,
body.creativeLab .crumb,
body.creativeLab .eyebrow,
body.creativeLab .control label,
body.creativeLab .metricLabel,
body.creativeLab .table th,
body.creativeLab .tag,
body.creativeLab .tinytext,
body.creativeLab .smallcaps{
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing:.12em;
  text-transform:uppercase;
}
body.creativeLab .brandSub{font-size:10px;color:#bcafa4;margin-top:7px}
body.creativeLab .sideLabel{color:#8e7f73;font-size:10px}
body.creativeLab .nav button{
  border:1px solid transparent;
  border-radius:14px 14px 14px 2px;
  padding:12px 12px;
  color:#cfbeb0;
}
body.creativeLab .nav button:hover{background:#2a2237;color:#fff;border-color:#56495d}
body.creativeLab .nav button.active{
  background:#f7f0e6;

body.creativeLab .equityPage .eqAssumptionsPanel{background:#fcf7f0;border:2px solid #17141c;border-radius:20px 20px 20px 3px;padding:22px;box-shadow:6px 6px 0 #d8c8b8;min-width:0}

mple SD annualized')}${formatMini('Portfolio maximum drawdown',dollarRatio(pr.risk.maxDrawdown),'Realized')}${formatMini('Portfolio Sharpe',formatNumber(pr.risk.sharpe),'Ex-post estimate')}</div><div class="grid2"><div class="card"><h3>Portfolio wealth index</h3>${svgPath(pr.risk.wealth,'wealth')}</div><div class="card"><h3>Comparison · equal-weight</h3>${finRow('Your allocation · annual return',dollarRatio(pr.risk.annualReturn))}${finRow('Equal-weight · annual return',dollarRatio(pr.equal.annualReturn))}${finRow('Your allocation · annual vol',dollarRatio(pr.risk.annualVol))}${finRow('Equal-weight · annual vol',dollarRatio(pr.equal.annualVol))}${finRow('Your allocation · historical VaR',dollarRatio(pr.risk.varLoss))}${finRow('Equal-weight · historical VaR',dollarRatio(pr.equal.varLoss))}${finRow('Portfolio concentration (HHI)',formatNumber(pr.concentration,4))}</div></div><div class="card"><div class="spaced"><h3>Risk contribution & allocation</h3><button class="btn" data-action="port-export">↓ Portfolio evidence</button></div>${tableHtml(['Asset','Weight','Risk contribution'],pr.assets.map((a,i)=>[a.col,dollarRatio(a.weight/100),dollarRatio(pr.riskContribution[i])]),10)}<div class="help">Risk contribution is wᵢ(Σw)ᵢ / (wᵀΣw); it can be negative for hedging assets. Sum is 100% when estimated variance is positive.</div></div><div class="card"><h3>Pairwise return correlation</h3>${tableHtml(['Asset',...pr.assets.map(a=>a.col)],pr.assets.map((a,i)=>[a.col,...pr.correlation[i].map(x=>formatNumber(x,3))]),9)}</div><div class="card"><h3>Data quality and model assumptions</h3>${finRow('Fully aligned periods',String(pr.observations.length))}${finRow('Skipped intervals with missing/nonpositive prices',String(pr.issues.invalidIntervals))}${finRow('Duplicate date rows excluded',String(pr.issues.duplicateDates))}<div class="warningBox">${escapeHtml(pr.assumptions)}</div></div>`:`<div class="card empty">Select assets and weights, then evaluate the portfolio using real data or a clearly labeled synthetic example.</div>`}`}
function financialDemo(){const rand=seededRandom(20260211),data=[],start=new Date(Date.UTC(2024,0,2));let pa=100,pb=100,idx=100,i=0;while(data.length<340){const d=new Date(start.getTime()+i*86400000),wd=d.getUTCDay();i++;if(wd===0||wd===6)continue;function z(){let u=Math.max(1e-12,rand()),v=rand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}const market=.00036+.008*z(),ra=.0006+.95*market+.006*z(),rb=.00024+.5*market+.005*z();pa*=1+ra;pb*=1+rb;idx*=1+market;data.push({Date:d.toISOString().slice(0,10),AssetA_Price:pa.toFixed(4),AssetB_Price:pb.toFixed(4),Benchmark_Price:idx.toFixed(4)})}addTable('Finance_Synthetic_Prices',Object.keys(data[0]),data,'DEMO','Synthetic correlated market-price illustration · not financial history');fin.result=null;fin.boot=null;fin.portfolioResult=null;fin.config={...fin.config,dateCol:'Date',valueCol:'AssetA_Price',benchmarkCol:'Benchmark_Price',mode:'price'};fin.portfolio={...fin.portfolio,dateCol:'Date',assets:[{col:'AssetA_Price',weight:50},{col:'AssetB_Price',weight:50}]};render();toast('Synthetic finance dataset added (340 trading dates).')}
function finRun(){const t=active(),c=fin.config;const rows=t.rows;const source=FF.series(rows,{dateCol:c.dateCol,valueCol:c.valueCol,mode:c.mode,returnUnit:c.returnUnit});const risk=FF.riskMetrics(source.observations,{periods:Number(c.periods),rfAnnual:Number(c.rfPct)/100,confidence:Number(c.confidence)});let benchmark=null,qualityWarnings=[];if(c.benchmarkCol){try{const sourceB=FF.series(rows,{dateCol:c.dateCol,valueCol:c.benchmarkCol,mode:c.mode,returnUnit:c.returnUnit});benchmark=FF.benchmarkMetrics(source.observations,sourceB.observations,Number(c.periods),Number(c.rfPct)/100);if(sourceB.issues.invalidValues||sourceB.issues.duplicateDates)qualityWarnings.push('Benchmark data also contain invalid or duplicate rows.');}catch(err){benchmark={error:err.message};qualityWarnings.push('Benchmark calculation failed; asset statistics remain available.')}}if(source.issues.duplicateDates)qualityWarnings.push('All rows for a duplicated date were excluded; resolve this before interpreting returns.');if(source.issues.invalidValues)qualityWarnings.push('Invalid asset values were excluded. In price mode, the next interval was not bridged.');if(source.issues.skippedIntervals)qualityWarnings.push('Intervals adjacent to missing or invalid prices were omitted instead of being interpolated.');if(source.issues.invalidDates||source.issues.missingDates)qualityWarnings.push('Rows with invalid or missing dates were excluded.');const window=FF.rollingMetrics(source.observations,Number(c.window),Number(c.periods));fin.result={source:t.name,sourceId:t.id,date:new Date().toISOString(),config:structuredClone(c),series:source,metrics:risk,benchmark,rolling:window,diagnostics:FF.diagnostics(source.observations),qualityWarnings};fin.boot=null;advLog('Finance','Historical risk & return',t.name,structuredClone(c),risk.n);fin.log.push({at:new Date().toISOString(),dataset:t.name,method:'Financial risk',config:structuredClone(c),observations:risk.n});}
function finBoot(){if(!fin.result)throw Error('Run risk analysis first.');if(fin.result.metrics.n>10000)throw Error('Bootstrap is limited to 10,000 returns for responsive local execution; use a shorter date range.');const c=fin.result.config;fin.boot=FF.bootstrap(fin.result.series.observations,{periods:Number(c.periods),rfAnnual:Number(c.rfPct)/100,replicates:Number(c.bootRep),block:Number(c.bootBlock),seed:Number(c.seed)});advLog('Finance','Moving-block bootstrap',fin.result.source,{replicates:c.bootRep,block:c.bootBlock,seed:c.seed},fin.result.metrics.n)}
function portRun(){const {t,p}=portDefaults();const result=FF.portfolio(t.rows,{dateCol:p.dateCol,assets:p.assets.map(a=>({...a,weight:Number(a.weight)})),periods:Number(p.periods),rfAnnual:Number(p.rfPct)/100,confidence:Number(p.confidence)});fin.portfolioResult=result;advLog('Finance','Daily-rebalanced portfolio',t.name,structuredClone(p),result.observations.length)}
function exportFin(kind){const r=fin.result;if(!r)throw Error('Run a financial analysis first.');if(kind==='csv'){const rows=r.metrics.wealth.map(o=>({Date:o.date,Return:o.r,Wealth:o.wealth,Drawdown:o.drawdown,SourceRow:o.sourceRow}));download('folio_financial_returns.csv',serializeCSV(['Date','Return','Wealth','Drawdown','SourceRow'],rows),'text/csv');return}const evidence={product:'Folio Analytics v3',calculatedAt:r.date,dataset:r.source,datasetID:r.sourceId,parameters:r.config,quality:r.series.issues,qualityWarnings:r.qualityWarnings,metrics:Object.fromEntries(Object.entries(r.metrics).filter(([k])=>k!=='wealth')),benchmark:r.benchmark,diagnostics:r.diagnostics,bootstrap:fin.boot};if(kind==='json'){download('folio_finance_evidence.json',JSON.stringify(evidence,null,2),'application/json');return}const mm=evidence.metrics,sections=['# Financial Risk Analysis · Folio v3','',`Dataset: ${r.source}`,`Generated (UTC): ${r.date}`,'', '## User-selected method & parameters','```json',JSON.stringify(r.config,null,2),'```','', '## Risk and performance estimates',...['n','annualReturn','annualVol','sharpe','sortino','maxDrawdown','varLoss','expectedShortfall','confidence','totalReturn'].map(k=>`- ${k}: ${mm[k]}`),'','## Benchmark','```json',JSON.stringify(r.benchmark,null,2),'```','','## Data quality','```json',JSON.stringify(r.series.issues,null,2),'```',...r.qualityWarnings.map(x=>`- ${x}`),'','## Bootstrap (if run)','```json',JSON.stringify(fin.boot,null,2),'```','','## Methodology / limitations','Returns are simple period-over-period returns; price mode uses P(t)/P(t−1) − 1.','CAGR compounds observed returns and scales by periods/year. Annualized volatility is sample standard deviation × sqrt(periods/year).','Historical VaR is max(0, - empirical lower-tail interpolated quantile). Expected shortfall averages the worst ceil(alpha*n) observations; definitions differ across conventions.','Sharpe uses period arithmetic excess mean annualized by multiplying periods/year and annualized standard deviation. Downside deviation uses risk-free return threshold.','No cash flows, dividends, splits, costs or taxes are modeled. Annualization assumes homogeneous observation frequency.','Results are retrospective and do not forecast future returns. Missing values and duplicate dates require analyst review.','Moving-block bootstrap may not provide reliable inference under nonstationarity or long-range dependence.','','## Analyst interpretation','(Write your conclusions and alternative explanations here.)'];download('folio_financial_methods_report.md',sections.join('\n'),'text/markdown')}
function handleFinanceActions(act){try{if(act==='excel-open'){$('excelInput').click();return}if(act==='fin-demo'){financialDemo();return}if(act==='fin-run')finRun();else if(act==='fin-bootstrap')finBoot();else if(act==='fin-export-csv')return exportFin('csv');else if(act==='fin-export-json')return exportFin('json');else if(act==='fin-export-md')return exportFin('md');else if(act==='port-equalize'){const a=fin.portfolio.assets,n=a.length;for(let i=0;i<a.length;i++)a[i].weight=i===a.length-1?Number((100-a.slice(0,i).reduce((s,v)=>s+v.weight,0)).toFixed(6)):Number((100/n).toFixed(6));fin.portfolioResult=null}else if(act==='port-run')portRun();else if(act==='port-export'){if(!fin.portfolioResult)throw Error('Evaluate a portfolio first.');const p=fin.portfolioResult;download('folio_portfolio_evidence.json',JSON.stringify({dataset:active()?.name,parameters:fin.portfolio,computedAt:new Date().toISOString(),metrics:{risk:Object.fromEntries(Object.entries(p.risk).filter(([k])=>k!=='wealth')),equal:Object.fromEntries(Object.entries(p.equal).filter(([k])=>k!=='wealth'))},assets:p.assets,riskContribution:p.riskContribution,covariance:p.covariance,correlation:p.correlation,quality:p.issues,assumptions:p.assumptions},null,2),'application/json');return}render();}catch(e){toast(e.message,true)}}

<script>
'use strict';
/* Pure, deterministic equity-research calculations. Works in browser and Node. */
const FolioEquity = (()=>{
 const FIELDS=[
  ['year','Fiscal Year',1],['revenue','Revenue',1],['cogs','Cost of goods sold',0],
  ['ebit','Operating income / EBIT',1],['netIncome','Net income',1],
  ['assets','Total assets',1],['liabilities','Total liabilities',1],['equity','Total book equity',1],
  ['cfo','Cash flow from operations',1],['capex','Capital expenditures (positive outflow)',1],
  ['da','Depreciation & amortization',0],['cash','Cash and equivalents',1],
  ['debt','Interest-bearing debt',1],['shares','Diluted shares outstanding',1],
  ['nwc','Operating net working capital',0],['currentAssets','Current assets',0],['currentLiabilities','Current liabilities',0]
 ];
 const num=x=>{if(x===null||x===undefined||String(x).trim()==='')return null;
   let s=String(x).trim().replace(/[$€£₩\s,]/g,'');if(/^\(.*\)$/.test(s))s='-'+s.slice(1,-1);
   if(!/^[+-]?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i.test(s))return null;
   const n=Number(s);return Number.isFinite(n)?n:null};
 const ratio=(a,b)=>a===null||a===undefined||b===null||b===undefined||!Number.isFinite(a)||!Number.isFinite(b)||b===0?null:a/b;
 const nround=(x,d=5)=>x===null||!Number.isFinite(x)?null:Number(x.toFixed(d));
 const year=x=>{const s=String(x??'').trim();const m=s.match(/^(?:FY\s*)?((?:19|20)\d{2})(?:[-/]\d{2}[-/]\d{2})?$/i);return m?Number(m[1]):null};
 const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
 const synonyms={year:['fiscalyear','fyear','fy','year','period','fiscalperiod'],revenue:['revenue','totalrevenue','sales','netsales'],cogs:['cogs','costofgoodssold','costofrevenue'],ebit:['ebit','operatingincome','incomeoperations','operatingprofit'],netIncome:['netincome','netearnings','profitaftertax'],assets:['assets','totalassets'],liabilities:['liabilities','totalliabilities'],equity:['equity','totalequity','stockholdersequity','shareholdersequity'],cfo:['operatingcashflow','cashflowfromoperations','cfo','netcashfromoperations'],capex:['capex','capitalexpenditure','capitalexpenditures','purchaseofppe'],da:['da','depreciation','depreciationandamortization'],cash:['cash','cashandequivalents','cashandcashequivalents'],debt:['totaldebt','debt','interestbearingdebt'],shares:['shares','dilutedshares','sharesoutstanding','dilutedsharesoutstanding'],nwc:['nwc','operatingnwc','operatingnetworkingcapital'],currentAssets:['currentassets','totalcurrentassets'],currentLiabilities:['currentliabilities','totalcurrentliabilities']};
 function autoMap(cols){const out={};for(const [key] of FIELDS){const terms=synonyms[key]||[key];out[key]=cols.find(c=>terms.includes(norm(c)))||''}return out}
 function normalize(rows,map){
  const issues=[],data=[],seen=new Map();
  if(!Array.isArray(rows)||!rows.length)throw Error('Empty dataset. Import one annual statement row per fiscal year.');
  if(rows.length>100)throw Error('Financial statements must have <=100 fiscal-year rows. Filter quarterly or transactional data first.');
  for(let i=0;i<rows.length;i++){
   const raw=rows[i],item={_sourceRow:i+2},fy=year(raw[map.year]);
   if(fy===null){issues.push({level:'error',row:i+2,field:'year',message:'Missing or invalid fiscal year.'});continue}
   item.year=fy;if(seen.has(fy))issues.push({level:'error',row:i+2,field:'year',message:`Duplicate fiscal year ${fy}; also in source row ${seen.get(fy)}.`});else seen.set(fy,i+2);
   for(const [k,,required] of FIELDS){if(k==='year')continue;const col=map[k];const rawval=col?raw[col]:null;item[k]=num(rawval);if(required&&item[k]===null)issues.push({level:'error',row:i+2,field:k,message:`Required numeric field ${k} is missing or invalid.`});else if(col&&rawval!==null&&String(rawval).trim()!==''&&item[k]===null)issues.push({level:'warning',row:i+2,field:k,message:`Non-numeric value for ${k}.`})}
   for(const key of ['revenue','assets','liabilities','capex','cash','debt','shares']){
    if(item[key]!==null&&item[key]<0)issues.push({level:'error',row:i+2,field:key,message:`${key} must be nonnegative for this input convention.`})
   }
   if(item.shares===0)issues.push({level:'error',row:i+2,field:'shares',message:'Diluted shares must be > 0.'});
   if(item.equity!==null&&item.equity<=0)issues.push({level:'warning',row:i+2,field:'equity',message:'Nonpositive book equity: ROE and debt/book-equity comparisons are not meaningful.'});
   if(item.cogs!==null&&item.cogs<0)issues.push({level:'warning',row:i+2,field:'cogs',message:'COGS should be a positive expense.'});
   if(item.da!==null&&item.da<0)issues.push({level:'warning',row:i+2,field:'da',message:'D&A expected as positive add-back.'});
   if(item.assets!==null&&item.liabilities!==null&&item.equity!==null){const residual=item.assets-item.liabilities-item.equity;
    if(Math.abs(residual)>Math.max(0.001,Math.abs(item.assets)*0.001))issues.push({level:'warning',row:i+2,field:'balance',message:`Balance-sheet identity differs by ${nround(residual,2)} (assets - liabilities - equity).`})}
   data.push(item);
  }
  data.sort((a,b)=>a.year-b.year);
  for(let i=1;i<data.length;i++)if(data[i].year-data[i-1].year>1)issues.push({level:'warning',row:data[i]._sourceRow,field:'year',message:`Fiscal-year gap ${data[i-1].year}–${data[i].year}; growth comparisons are not annualized across gaps.`});
  return {data,issues,hasErrors:issues.some(x=>x.level==='error')};
 }
 function analyze(rows){return rows.map((r,i)=>{
  const prior=i?rows[i-1]:null,contiguous=!!prior&&prior.year===r.year-1;

 ${r?`<section class="eqHistSection"><div class="eqHistHeading"><div><span class="eqStudyIndex">RESEARCH PLATE 01 / OPERATING HISTORY</span><h2>Across the years.<br><em>Every number matters.</em></h2></div><div class="eqHistKey"><span>PERIODS ANALYZED</span><strong>${r.ratios.length}</strong><small>${r.ratios.length?`${r.ratios[0].year}–${latest.year}`:'No valid periods'}</small></div></div><div class="eqHistGrid"><section class="card eqHistoryChart">${eqFigureHeading('01','Operating trajectory','Revenue bars and observed EBIT margins across fiscal years.')}${eqHistoricalChart(values)}</section><aside class="eqMetricIndex"><div class="eqMetricIndexHeader">LATEST OBSERVATION <span>${latest?.year||'—'}</span></div>${[['Revenue',eqNumber(latest?.revenue),eq.company.currency+' · '+eq.company.scale],['EBIT margin',eqPercentage(latest?.operatingMargin),'Operating income / revenue'],['Free cash flow',eqNumber(latest?.fcf),'CFO − capex']].map(([l,v,d])=>`<div class="eqMetricRow"><span>${escapeHtml(l)}</span><strong>${escapeHtml(v)}</strong><small>${escapeHtml(d)}</small></div>`).join('')}</aside></div></section>
 <div class="eqQualityLayout">${eqQuality(r)}<aside class="eqQualityNote"><span class="eqStudyIndex">ANALYST NOTE</span><h3>Data quality is a research decision.</h3><p>Warnings are not automatically wrong and a clean run does not prove the filing is accurate. Always cross-check your data against its original source.</p><div class="eqQualityCounters"><strong>${r.statement.issues.filter(x=>x.level==='error').length}</strong><span>errors</span><strong>${r.statement.issues.filter(x=>x.level==='warning').length}</strong><span>warnings</span></div></aside></div>
 <section class="card eqHistoryLedger">${eqFigureHeading('02','Historical fundamentals','Annual measurements, traceable to original input rows.')}<div class="spaced eqLedgerTop"><span class="small muted">${escapeHtml(eq.company.currency)} · ${escapeHtml(eq.company.scale)}</span><button class="btn tiny" data-action="eq-export-history">Export ratios CSV</button></div><div class="tablewrap"><table><thead><tr><th>Fiscal year</th><th>Revenue</th><th>YoY revenue</th><th>Gross margin</th><th>EBIT margin</th><th>Net margin</th><th>ROE</th><th>ROA</th><th>Debt / Equity</th><th>FCF</th></tr></thead><tbody>${values.map(x=>`<tr><td>${x.year}</td><td>${eqNumber(x.revenue)}</td><td>${eqPercentage(x.revenueGrowth)}</td><td>${eqPercentage(x.grossMargin)}</td><td>${eqPercentage(x.operatingMargin)}</td><td>${eqPercentage(x.netMargin)}</td><td>${eqPercentage(x.roe)}</td><td>${eqPercentage(x.roa)}</td><td>${eqNumber(x.debtToEquity)}×</td><td>${eqNumber(x.fcf)}</td></tr>`).join('')}</tbody></table></div><p class="small muted">ROA and ROE use average beginning/end book values when adjacent fiscal years exist; otherwise shown as unavailable. Debt / Equity uses interest-bearing debt.</p></section>`:'<section class="card empty">Run financial analysis to generate data-quality checks and annual ratios.</section>'}`;
}
function eqAssumptions(){const a=eq.assumptions;return `<section class="eqModelAssumptions"><div class="eqAssumptionIntro"><span class="eqStudyIndex">MODEL CONTROLS / ANALYST-DEFINED</span><h2>The model is only<br>as good as its assumptions.</h2><p>Growth and operating margin vary by scenario. Tax, investment and discount inputs are shared. Changes are not included in results until you recalculate.</p><div class="eqPendingNote" id="eqPendingNote" hidden role="status">Inputs changed — recalculate to refresh the model.</div></div><div class="eqAssumptionsPanel"><div class="eqSharedHead"><span>01 / SHARED ASSUMPTIONS</span><span>Percent values</span></div><div class="eqMapGrid">${eqPercent('Effective cash tax rate','tax',a.tax,0,100)}${eqPercent('D&A / revenue','daPct',a.daPct,0,100)}${eqPercent('Capex / revenue','capexPct',a.capexPct,0,100)}${eqPercent('ΔNWC / Δrevenue','nwcPct',a.nwcPct,-100,100)}${eqPercent('WACC / discount rate','wacc',a.wacc,0.1,60)}${eqPercent('Perpetual terminal growth','terminalGrowth',a.terminalGrowth,-10,10)}</div><div class="eqSharedHead"><span>02 / SCENARIO DRIVERS</span><span>Bear · Base · Bull</span></div>${eqScenarioInputs()}<div class="eqModelActions"><button class="btn primary" data-action="eq-run">Recalculate 5-year DCF</button><button class="btn" data-action="eq-export-forecast">Export forecast CSV</button></div></div></section>`}
function eqDCF(){const r=eq.result,model=r?.model;
 return `<div class="eqDCFPage"><div class="eqStudyHeader"><div><span class="eqStudyIndex">FILE 02 / VALUATION</span><h2>A valuation is an argument.<br><em>Show your working.</em></h2></div><div class="eqStudyMeta"><span>METHODOLOGY</span><strong>FCFF / DCF</strong><small>5 explicit years + terminal value</small></div></div>
 ${!r?'<div class="card empty">Run the financial-statement analysis to initialize the valuation. <button class="btn" data-action="eq-tab" data-tab="statements">Financial statements</button></div>':''}
 ${model?eqValuationBrief(model):''}
 ${eqAssumptions()}
 ${r&&!model?`<div class="card eqDcfError">${eqFigureHeading('!','DCF not available','Resolve data-quality errors before valuation.') }<p>${escapeHtml(r.modelError||'Unable to calculate valuation from the current data.')}</p></div>`:''}
 ${model?`<div class="eqModelLedger"><section class="card eqBridgeCard">${eqFigureHeading('02','Base-case valuation bridge','From present value of cash flows to equity value.')}<div class="eqBridgeSteps">${[['PV forecast FCFF',model.scenarios.base.pvExplicit,'positive'],['PV terminal value',model.scenarios.base.pvTerminal,'positive'],['Enterprise value',model.scenarios.base.enterpriseValue,'subtotal'],['Less: debt',-model.scenarios.base.bridge.debt,'subtraction'],['Add: cash',model.scenarios.base.bridge.cash,'positive'],['Equity value',model.scenarios.base.equityValue,'total'],['Diluted shares',model.scenarios.base.bridge.shares,'shares']].map(([label,val,type])=>`<div class="eqBridgeRow eqBridge-${type}"><span>${escapeHtml(label)}</span><strong>${eqNumber(val)}</strong></div>`).join('')}</div><div class="eqBridgeTerminal"><span>TERMINAL VALUE / EV</span><strong>${eqPercentage(model.scenarios.base.terminalShare)}</strong></div>${model.scenarios.base.marketPrice!==null?`<div class="eqBridgeTerminal"><span>MODEL GAP VS. MANUAL PRICE</span><strong>${eqPercentage(model.scenarios.base.impliedGap)}</strong></div>`:''}<p class="eqBridgeCaution">The enterprise-to-equity bridge is simplified. Preferred shares, minority interests, leases and restricted cash require separate analyst adjustments.</p></section>
 <section class="card eqScheduleCard">${eqFigureHeading('03','FCFF / projected ledger','Base scenario · discounted at end of each fiscal year.')}<div class="tablewrap"><table><thead><tr><th>FY</th><th>Revenue</th><th>EBIT</th><th>NOPAT</th><th>D&A</th><th>Capex</th><th>ΔNWC</th><th>FCFF</th><th>PV</th></tr></thead><tbody>${model.scenarios.base.schedule.map(x=>`<tr><td>${x.year}</td><td>${eqNumber(x.revenue)}</td><td>${eqNumber(x.ebit)}</td><td>${eqNumber(x.nopat)}</td><td>${eqNumber(x.da)}</td><td>${eqNumber(x.capex)}</td><td>${eqNumber(x.deltaNwc)}</td><td><strong>${eqNumber(x.fcff)}</strong></td><td>${eqNumber(x.presentValue)}</td></tr>`).join('')}</tbody></table></div><p class="small muted">Amounts in ${escapeHtml(eq.company.currency)} ${escapeHtml(eq.company.scale)}. Forecasts use fixed growth and margin assumptions, not a balanced three-statement model.</p></section></div>${eqSensitivityHeat(model)}`:''}</div>`;
}
function eqReport(){const r=eq.result;return `<div class="eqTwo"><section class="card"><h3>Analyst-authored research memo</h3><p class="small muted">The system does not generate a stock recommendation. Explain your own assumptions, risks, and dissenting evidence.</p>${[['thesis','Research question & thesis'],['drivers','Operating drivers & valuation assumptions'],['risks','Risks / counterarguments'],['limitations','Model limitations & follow-up work']].map(([key,label])=>`<div class="control" style="margin:12px 0"><label for="eqmemo-${key}">${label}</label><textarea class="input" id="eqmemo-${key}" data-eq-memo="${key}" rows="4" placeholder="Analyst-written notes...">${escapeHtml(eq.memo[key])}</textarea></div>`).join('')}</section><section class="card"><h3>Evidence package</h3><p>Each export records selected source columns, original source row numbers, quality warnings, assumptions, calculation results and the analyst's own written interpretation.</p><div class="eqExport"><button class="btn primary" data-action="eq-export-report">↓ Research memo (Markdown)</button><button class="btn" data-action="eq-export-evidence">↓ Reproducible evidence (JSON)</button><button class="btn" data-action="eq-export-history">↓ Historical ratios (CSV)</button><button class="btn" data-action="eq-export-forecast">↓ Forecast schedule (CSV)</button></div><div class="divider"></div><h4>Model disclosures</h4><p class="small muted">No live quote lookup, automatic SEC filing ingestion, currency conversion, split adjustments, earnings normalization, or buy/sell decision. Always check filing dates and statement basis externally before publication.</p><div class="divider"></div><h4>Analysis runs</h4>${eq.log.slice(-6).reverse().map(x=>`<div class="statrow"><span>${escapeHtml(x.when.slice(0,16).replace('T',' '))}</span><b>${x.periods} FY · ${x.errors} errors</b></div>`).join('')||'<p class="small muted">No analysis runs saved.</p>'}</section></div>${r?`<section class="card"><h3>Current study details</h3><p class="small muted">${escapeHtml(r.company.name||'Unnamed company')} · ${escapeHtml(r.source)} · ${escapeHtml(r.computedAt)} · data quality ${r.statement.issues.filter(x=>x.level==='error').length} error(s), ${r.statement.issues.filter(x=>x.level==='warning').length} warning(s).</p></section>`:''}`}
function equityView(){eqSync();return '<div class="equityPage">'+eqIntro()+`<div class="eqTabs">${[['statements','1 · Financial statements'],['valuation','2 · Forecast & valuation'],['report','3 · Research report']].map(([k,l])=>`<button data-action="eq-tab" data-tab="${k}" class="btn ${eq.tab===k?'primary':''}">${l}</button>`).join('')}</div>${eq.tab==='statements'?eqStatements():eq.tab==='valuation'?eqDCF():eqReport()}</div>`}
function eqEvidence(){const r=eq.result;if(!r)throw Error('Run the study before exporting.');return {product:'ASTER Equity Research Atelier v4.2.1',version:'4.0',dataset:{name:r.source,kind:r.kind,meta:r.sourceMeta,recordCount:r.statement.data.length,company:r.company,mapping:r.mapping,sourceNote:'Input source is user supplied; no independent data verification performed.'},generatedAt:r.computedAt,sourceRows:r.statement.data,issues:r.statement.issues,ratios:r.ratios,assumptions:r.assumptions,valuation:r.model,modelError:r.modelError,analystMemo:{...eq.memo},methodology:{scale:'Statements and diluted shares must use matching base scale (millions / millions etc.).',returns:'YoY growth only between consecutive fiscal years; ROA and ROE use average adjacent year book capital.',freeCashFlow:'Historical FCF = CFO − capital expenditures, where capital expenditures are positive outflow.',valuation:'Explicit annual FCFF projection discounted using end-of-period WACC; perpetuity-growth terminal value and simplified cash/debt bridge.',cautions:'Analyst-entered assumptions. No independent audit of filings, no investment recommendation.'}}}
function eqMd(){const r=eqEvidence(),p=r.valuation,co=r.dataset.company;const md=[`# Equity Research · ${co.name||'Unnamed company'}`,'',`Identifier: ${co.ticker||'not supplied'} | Currency: ${co.currency||'n/a'} | Scale: ${co.scale||'n/a'}`,`Data source / filing: ${co.source||'not supplied'}`,`Filing / as-of date: ${co.sourceDate||'not supplied'}`,`Generated: ${r.generatedAt}`,`Source table: ${r.dataset.name}`,'','## Research question and thesis',r.analystMemo.thesis||'(Analyst to complete)','', '## Historical operating fundamentals','| FY | Revenue | EBIT margin | Net margin | ROE | FCF |','|---|---:|---:|---:|---:|---:|',...r.ratios.map(x=>`| ${x.year} | ${eqNumber(x.revenue)} | ${eqPercentage(x.operatingMargin)} | ${eqPercentage(x.netMargin)} | ${eqPercentage(x.roe)} | ${eqNumber(x.fcf)} |`),'','## Data-quality observations',...r.issues.map(x=>`- [${x.level.toUpperCase()}] source row ${x.row}: ${x.message}`),'','## Forecast inputs', '```json',JSON.stringify(r.assumptions,null,2),'```','', '## Valuation'];if(p){md.push('| Scenario | Enterprise value | Equity value | Equity value per diluted share |','|---|---:|---:|---:|',...['bear','base','bull'].map(k=>`| ${k} | ${eqNumber(p.scenarios[k].enterpriseValue)} | ${eqNumber(p.scenarios[k].equityValue)} | ${eqNumber(p.scenarios[k].perShare)} |`),'',`Base-case terminal / enterprise value: ${eqPercentage(p.scenarios.base.terminalShare)}`)}else md.push(`DCF not calculated: ${r.modelError||'Quality errors.'}`);md.push('','## Key operating drivers and valuation assumptions',r.analystMemo.drivers||'(Analyst to complete)','','## Risks / disconfirming evidence',r.analystMemo.risks||'(Analyst to complete)','','## Limitations & further work',r.analystMemo.limitations||'(Analyst to complete)','', '## Methodology',...Object.entries(r.methodology).map(([k,v])=>`- ${k}: ${v}`),'','**Synthetic datasets are not real market evidence. This report is not investment advice.**');return md.join('\n')}
function eqExport(kind){const r=eqEvidence(),k=kind;if(k==='evidence'){download('folio_v4_equity_evidence.json',JSON.stringify(r,null,2),'application/json');return}if(k==='report'){download('folio_v4_equity_research_report.md',eqMd(),'text/markdown');return}if(k==='history'){const cols=['year','revenue','revenueGrowth','grossMargin','operatingMargin','netMargin','roa','roe','debtToEquity','currentRatio','fcf','_sourceRow'];download('folio_v4_historical_ratios.csv',serializeCSV(cols,r.ratios),'text/csv');return}if(k==='forecast'){if(!r.valuation)throw Error('Resolve statement validation and run DCF first.');const cols=['scenario','year','revenue','ebit','nopat','da','capex','deltaNwc','fcff','discountFactor','presentValue'];const out=['bear','base','bull'].flatMap(k=>r.valuation.scenarios[k].schedule.map(x=>({scenario:k,...x})));download('folio_v4_fcff_forecasts.csv',serializeCSV(cols,out),'text/csv')}}
function eqAction(action,el){try{if(action==='eq-demo')return eqDemo();if(action==='eq-tab'){eq.tab=el.dataset.tab;render();return}if(action==='eq-template'){const cols=FolioEquity.FIELDS.map(([k])=>({year:'FiscalYear',ebit:'OperatingIncome',netIncome:'NetIncome',cfo:'OperatingCashFlow',da:'DA',shares:'DilutedShares',assets:'TotalAssets',liabilities:'TotalLiabilities',equity:'TotalEquity',nwc:'OperatingNWC',currentAssets:'CurrentAssets',currentLiabilities:'CurrentLiabilities',cash:'Cash',debt:'TotalDebt',capex:'Capex',cogs:'COGS',revenue:'Revenue'}[k]));download('folio_v4_financial_statements_template.csv',serializeCSV(cols,[Object.fromEntries(cols.map(c=>[c,'']))]),'text/csv');return}if(action==='eq-run')return eqRun();if(action.startsWith('eq-export-'))return eqExport(action.slice('eq-export-'.length));}catch(e){toast(e.message,true)}}
const eqOldAction=handleAction;handleAction=function(action,el){if(action.startsWith('eq-'))return eqAction(action,el);return eqOldAction(action,el)};
document.addEventListener('change',e=>{const el=e.target;
 if(el.hasAttribute('data-eq-map')){eq.mapping[el.dataset.eqMap]=el.value;eq.result=null;render();return}
 if(el.hasAttribute('data-eq-meta')){eq.company[el.dataset.eqMeta]=el.value.trim();eq.result=null;return}
 if(el.hasAttribute('data-eq-param')){const key=el.dataset.eqParam,parts=key.split('.');if(parts.length===2)eq.assumptions[parts[0]][parts[1]]=el.value===''?'':Number(el.value)/100;else eq.assumptions[key]=el.value===''?'':Number(el.value)/100;eq.result=null;const dirty=document.getElementById('eqPendingNote');if(dirty)dirty.hidden=false;return}
 if(el.hasAttribute('data-eq-memo'))eq.memo[el.dataset.eqMemo]=el.value;
});
const eqOldRender=render;render=function(){if(state.view!=='equity'){eqOldRender();if(state.view==='overview'){$('page').insertAdjacentHTML('afterbegin',`<div class="eqSpotlight"><div><div class="eyebrow">ASTER // EQUITY RESEARCH</div><h3>Equity Research Studio</h3><p>Financial statements, validation, fundamental ratios, analyst-controlled DCF scenarios and source-traceable research reports.</p></div><button class="btn primary" data-nav="equity">Open Equity Research ↗</button></div>`)}return}
 eqSync();$('nav').innerHTML=NAV.map(([key,ic,label])=>`<button data-nav="${key}" class="${state.view===key?'active':''}"><span class="glyph">${ic}</span>${label}</button>`).join('');const item=NAV.find(x=>x[0]===state.view);$('breadcrumb').textContent=item[2];$('topTitle').textContent=item[3];$('datasetSelect').innerHTML=state.tables.map(x=>`<option value="${x.id}" ${x.id===state.active?'selected':''}>${escapeHtml(x.name)} · ${fmt(x.rows.length,0)} rows</option>`).join('')||'<option>No datasets</option>';$('datasetSelect').disabled=!state.tables.length;$('page').innerHTML=equityView()+`<div class="footer">ASTER v4 · Offline equity research · Assumptions are analyst-authored · Historical statements do not guarantee valuation outcomes · Not investment advice</div>`};
// Workspace exports store studies by table order. IDs are regenerated by the
// legacy importer, so a recorded array index is safer than the original ID.
const eqOldSave=saveWorkspace;saveWorkspace=function(){
 eqSync();if(eq.datasetId)eq.studies.set(eq.datasetId,eqCapture());
 const originalDownload=download;
 download=function(name,content,mime){
  if(name==='folio_workspace_v3.json'){
   try{const w=JSON.parse(content);w.version=4;w.equity={...eqCapture(),activeIndex:state.tables.findIndex(t=>t.id===state.active),studies:state.tables.map(t=>eq.studies.get(t.id)||null)};return originalDownload('aster_equity_workspace_v4.json',JSON.stringify(w,null,2),'application/json')}
   finally{download=originalDownload}
  }
  return originalDownload(name,content,mime)
 };
 try{eqOldSave()}finally{download=originalDownload}
};
const eqOldImport=importWorkspace;importWorkspace=async function(file){
 if(!file)return;
 let original=null;try{original=JSON.parse(await file.text())}catch(e){}
 const previousTables=state.tables;
 await eqOldImport(file);
 // The original importer preserves existing state on rejected JSON.
 if(state.tables===previousTables)return;
 eq.studies=new Map();eq.datasetId=null;
 const saved=original?.equity;
 if(saved){
  if(Array.isArray(saved.studies)){
   state.tables.forEach((t,i)=>{if(saved.studies[i])eq.studies.set(t.id,saved.studies[i])})
  }else if(state.tables.length){
   // Backward compatibility: earlier v4 had just one equity research draft.
   const legacyIndex=Number.isInteger(saved.activeIndex)?saved.activeIndex:0;
   if(state.tables[legacyIndex])eq.studies.set(state.tables[legacyIndex].id,saved)
  }
  if(Number.isInteger(saved.activeIndex)&&state.tables[saved.activeIndex])state.active=state.tables[saved.activeIndex].id;
 }
 eqSync();render();
};
const eqOldReport=exportReport;exportReport=function(){if(state.view==='equity'&&eq.result)return eqExport('report');return eqOldReport()};
const eqOldImportExcel=importExcelFiles;
importExcelFiles=async function(files){
 const before=new Set(state.tables.map(t=>t.id));await eqOldImportExcel(files);
 const incoming=state.tables.filter(t=>!before.has(t.id));
 const statement=incoming.find(t=>{const m=FolioEquity.autoMap(t.columns);return !!(m.year&&m.revenue&&m.ebit&&m.assets&&m.equity)});
 if(statement){switchDataset(statement.id);toast('Financial statements sheet selected. Open Equity Research to map and analyze.');}
};
const eqFoot=document.querySelector('.sideBottom');if(eqFoot)eqFoot.innerHTML=eqFoot.innerHTML.replace(/v3\.0|v1\.0/g,'v4.0');
render();
